# Default values for pm2-monitor (SERVER / hub mode).
# This is a YAML-formatted file. Values can be overridden with --set or -f.

# Number of hub replicas. Keep at 1: the alias store is a single-writer
# ReadWriteOnce PVC and agent WebSocket state is held per-pod.
replicaCount: 1

image:
  # Image built from the repo-root Dockerfile (see FEAT-001).
  repository: pm2-monitor
  # Overridable; defaults to .Chart.AppVersion when left empty.
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Secrets needed to pull a private image (optional).
imagePullSecrets: []

# Override chart name / fullname if desired.
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  # Service port. Container always listens on 3000.
  port: 3000

ingress:
  # TLS is best terminated at the Ingress (recommended). The app itself
  # defaults to plain HTTP behind the proxy; enable native TLS only if you
  # cannot terminate at the edge.
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: pm2-monitor.local
      paths:
        - path: /
          pathType: Prefix
  # TLS scaffolding. Fill secretName with a TLS Secret (e.g. managed by cert-manager).
  tls: []
    # - secretName: pm2-monitor-tls
    #   hosts:
    #     - pm2-monitor.local

# Container resource requests/limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  # The alias store (ALIAS_STORE_FILE) is persisted operator state and must
  # live on a writable volume mounted at /app/config. Disable only if you do
  # not need alias persistence across restarts.
  enabled: true
  size: 1Gi
  # Leave empty to use the cluster default StorageClass.
  storageClass: ""

# Non-secret environment variables rendered into a ConfigMap.
# These mirror the server-mode schema in src/config/env.ts.
env:
  MODE: server
  # Must be 0.0.0.0 inside a container so the service is reachable.
  HOST: 0.0.0.0
  PORT: "3000"
  AUTH_MODE: apikey
  AGENT_WS_PATH: /agent
  # Must sit on the writable PVC dir (write-temp-then-rename happens in this dir).
  ALIAS_STORE_FILE: /app/config/agent-aliases.json
  ALERT_RULES_FILE: config/alert-rules.json
  METRICS_INTERVAL_MS: "5000"
  METRICS_RETENTION: "720"
  ERROR_SCAN_INTERVAL_MS: "10000"
  DEFAULT_COOLDOWN_SEC: "300"
  INTENTIONAL_ACTION_GRACE_MS: "15000"
  DIGEST_INTERVAL_MS: "3600000"
  LOG_LEVEL: info

# Secret values for server mode.
# API_KEY and AGENT_TOKENS are REQUIRED for server mode. Supply them via
# --set secret.apiKey=... --set secret.agentTokens=... or point
# secret.existingSecret at a pre-created Secret (keys: API_KEY, AGENT_TOKENS,
# and optionally SMTP_PASS, TEAMS_WEBHOOK_URL).
secret:
  # Create a chart-managed Secret. Ignored when existingSecret is set.
  create: true
  # Name of a pre-created Secret to use instead of a chart-managed one.
  existingSecret: ""
  apiKey: ""
  # Comma-separated list of agent tokens.
  agentTokens: ""
  smtpPass: ""
  teamsWebhookUrl: ""

# Pod-level security context. fsGroup makes the mounted PVC writable by the
# non-root group so the alias store can be persisted.
podSecurityContext:
  fsGroup: 1000

# Container-level security context. The image runs as the non-root `node`
# user (uid/gid 1000) built in the Dockerfile.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}
tolerations: []
affinity: {}
