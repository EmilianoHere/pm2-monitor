{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pm2-monitor.fullname" . }}-secret
  labels:
    {{- include "pm2-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ required "secret.apiKey is required for server mode (or set secret.existingSecret)" .Values.secret.apiKey | quote }}
  AGENT_TOKENS: {{ required "secret.agentTokens is required for server mode (or set secret.existingSecret)" .Values.secret.agentTokens | quote }}
  {{- if .Values.secret.smtpPass }}
  SMTP_PASS: {{ .Values.secret.smtpPass | quote }}
  {{- end }}
  {{- if .Values.secret.teamsWebhookUrl }}
  TEAMS_WEBHOOK_URL: {{ .Values.secret.teamsWebhookUrl | quote }}
  {{- end }}
{{- end }}
